[project]
name = "ad-serving-agent"
version = "0.1.0"
description = "广告投放执行 Agent 后端"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "asyncmy>=0.2.10,<0.3",
    "dashscope>=1.20,<2",
    "fastapi[standard]>=0.137,<0.138",
    "langchain==1.0.3",
    "langchain-community>=0.4,<1",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=0.3,<2",
    "langgraph==1.0.3",
    "mcp>=1,<2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.0,<3",
    "pyjwt>=2.13.0",
    "pymilvus>=2.6,<3",
    "pypdf>=5,<7",
    "python-docx>=1,<2",
    "redis>=7,<8",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
